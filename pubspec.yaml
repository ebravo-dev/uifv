name: ui2
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_svg_provider: ^0.1.8
  eva_icons_flutter: ^3.0.0
  rive_splash_screen: ^0.0.1
  sqflite: ^2.0.0+3
  lazy_load_scrollview: ^1.3.0
  geocoder: ^0.2.1
  gps: ^0.1.1
  google_maps: ^5.1.0
  google_maps_flutter: ^2.0.6
  cached_network_image: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/img/
    - assets/rive/
  
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
